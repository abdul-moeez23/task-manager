# Backend .NET 9 Azure DevOps Pipeline
# Build, Test, Publish, Deploy .NET 9 API to Azure App Service

trigger:
  branches:
    include:
      - main   # Run pipeline on push to main branch

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  solution: 'TaskManager.API/TaskManager.API.sln'   # agar solution file hai
  projectPath: 'TaskManager.API/TaskManager.API.csproj'

steps:
# 1️⃣ Install .NET SDK
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'    # Match local SDK
    includePreviewVersions: true

# 2️⃣ Restore NuGet packages
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(solution)'

# 3️⃣ Build the solution
- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# 4️⃣ Run unit tests (optional, if you have tests)
- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# 5️⃣ Publish the project (prepare for deployment)
- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

# 6️⃣ Deploy to Azure App Service
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Moeez-Azure-Connection'
    appType: 'webApp'
    appName: 'taskmanager-api'
    package: '$(Build.ArtifactStagingDirectory)/*'

trigger:
  branches:
    include:
      - main   # Run pipeline on push to main branch

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  solution: 'TaskManager.API/TaskManager.API.sln'   # Correct path to solution file (for API)
  projectPath: 'TaskManager.API/TaskManager.API.csproj'  # Correct path to project file (for API)

steps:
# 1️⃣ Install .NET SDK (for backend)
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '5.x'   # Match local SDK with .NET 5
    installationPath: $(Agent.ToolsDirectory)/dotnet

# 2️⃣ Restore NuGet packages (for backend)
- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(solution)'

# 3️⃣ Build the solution (for backend)
- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# 4️⃣ Run unit tests (optional, if you have tests) (for backend)
- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# 5️⃣ Publish the backend project (prepare for deployment)
- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

# 6️⃣ Deploy the backend API to Azure App Service
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Moeez-Azure-Connection'  # Your Azure Service Connection
    appType: 'webApp'
    appName: 'taskmanager-api'  # Azure App Service name for API
    package: '$(Build.ArtifactStagingDirectory)/*'


# 7️⃣ Install Node.js (for frontend)
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'   # Angular 19 requires Node.js ^18.19.1 || ^20.11.1 || >=22.0.0
  displayName: 'Install Node.js'

# 8️⃣ Install Angular dependencies (for frontend)
- task: Npm@1
  inputs:
    command: 'install'
    workingDir: '$(Build.SourcesDirectory)/task-manager-frontend'  # Path to frontend
  displayName: 'Install Frontend Dependencies'

# 9️⃣ Build the Angular app (for frontend)
- task: Npm@1
  inputs:
    command: 'custom'   # Use custom command to run scripts
    customCommand: 'run build -- --configuration production'  # Correct syntax for passing args to npm run
    workingDir: '$(Build.SourcesDirectory)/task-manager-frontend'  # Path to frontend
  displayName: 'Build Angular App'

# 🔟 Deploy the frontend UI to Azure App Service
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Moeez-Azure-Connection'  # Your Azure Service Connection
    appName: 'taskmanager-ui'  # Azure App Service name for UI
    package: '$(Build.SourcesDirectory)/task-manager-frontend/dist/task-manager-frontend'  # Point to the inner folder containing index.html
  displayName: 'Deploy Angular App to Azure'

<!-- Animated Background -->
<div class="login-bg">
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
    <div class="shape shape-6"></div>
  </div>

  <!-- Login Card -->
  <div class="login-container" [class.shake]="shakeForm" (animationend)="shakeForm = false">
    <!-- Logo / Brand -->
    <div class="brand-section">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </div>
      <h1 class="brand-title">TaskManager</h1>
      <p class="brand-subtitle">Welcome back! Sign in to continue</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="login()" class="login-form">
      <!-- Username Field -->
      <div class="input-group" [class.focused]="usernameFocused" [class.has-value]="username.length > 0">
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div class="input-wrapper">
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            id="login-username"
            required
            autocomplete="username"
            (focus)="usernameFocused = true"
            (blur)="usernameFocused = false"
          />
          <label for="login-username">Username</label>
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-group" [class.focused]="passwordFocused" [class.has-value]="password.length > 0">
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            id="login-password"
            required
            autocomplete="current-password"
            (focus)="passwordFocused = true"
            (blur)="passwordFocused = false"
          />
          <label for="login-password">Password</label>
        </div>
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
          <!-- Eye Icon (show) -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <!-- Eye Off Icon (hide) -->
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login Button -->
      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span class="btn-text" *ngIf="!isLoading">Sign In</span>
        <div class="btn-loader" *ngIf="isLoading">
          <div class="spinner"></div>
          <span>Signing in...</span>
        </div>
        <div class="btn-shine"></div>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or</span>
    </div>

    <!-- Register Link -->
    <div class="register-section">
      <p>Don't have an account?</p>
      <button type="button" class="register-btn" (click)="register()">
        Create Account
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-section">
            <div class="logo-text">
                <div class="logo-icon"></div>
                <span>ErpCollab</span>
            </div>
        </div>
        <ul class="menu-list">
            <li class="menu-item active">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                <span>Create Business Partner</span>
            </li>
            <li class="menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span (click)="logout()">Logout</span>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="welcome-text">
                Welcome, <span class="welcome-role">Master Data Coordinator</span>
            </div>
            <div class="user-profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
            <h1 class="page-title">Register Business Partner</h1>

            <div class="content-card">
                <h2 class="section-title">Business Information</h2>
                
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Select Country *</label>
                            <select class="form-control">
                                <option value="">Select Country</option>
                                <option value="US">United States</option>
                                <option value="UK">United Kingdom</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Enter Organization Number or Company Name *</label>
                            <input type="text" class="form-control" placeholder="Enter tax registration number (9 digits)">
                        </div>

                        <div class="form-group">
                            <label>CR Number (Optional)</label>
                            <input type="text" class="form-control" placeholder="Enter CR number">
                        </div>

                        <div class="form-group">
                            <label>Company Name *</label>
                            <input type="text" class="form-control" placeholder="Enter company name">
                        </div>

                        <div class="form-group">
                            <label>Registration Date</label>
                            <input type="date" class="form-control" placeholder="mm/dd/yyyy">
                        </div>

                        <div class="form-group">
                            <label>Foundation Date</label>
                            <input type="date" class="form-control" placeholder="mm/dd/yyyy">
                        </div>

                        <div class="form-group">
                            <label>Number of Employees *</label>
                            <input type="number" class="form-control" placeholder="Enter number of employees">
                        </div>

                        <div class="form-group">
                            <label>Bankruptcy</label>
                            <select class="form-control">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
